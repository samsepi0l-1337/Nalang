<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>진동 측정</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body { font-family: sans-serif; margin: 12px; background: #111; color: #eee; }
    #meta { font-size: 1.2rem; margin-bottom: 8px; }
    canvas { width: 100% !important; max-height: 70vh; }
  </style>
</head>
<body>
  <div id="meta">연결 중…</div>
  <canvas id="chart"></canvas>
  <script>
    const meta = document.getElementById("meta");
    const chart = new Chart(document.getElementById("chart"), {
      type: "line",
      data: { labels: [], datasets: [{ label: "RMS (g)", data: [], borderColor: "#4fc3f7", pointRadius: 0 }] },
      options: {
        animation: false,
        scales: { y: { beginAtZero: true } }
      }
    });
    const socket = io();
    socket.on("reading", (msg) => {
      meta.textContent = "RMS " + msg.rms_g.toFixed(3) + " g  PK " + msg.peak_g.toFixed(3) + " g  " + msg.axis;
      chart.data.labels = msg.history.map((p) => "");
      chart.data.datasets[0].data = msg.history.map((p) => p.rms_g);
      chart.update();
    });
  </script>
</body>
</html>
